name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    # Trusted Publishing (OIDC): no PyPI token stored anywhere. The PyPI
    # project must list this repo as a trusted publisher
    # (owner=Turbolino, repository=sf-profile-pruner, workflow=publish.yml).
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build/test dependencies
        run: python -m pip install --upgrade build lxml

      - name: Run unit tests
        run: python tests/test_prune_profile.py

      - name: Build distributions
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
